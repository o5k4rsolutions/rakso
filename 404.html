<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – Nie znaleziono strony | Rakso Web Development</title>
<link rel="icon" href="https://rakso.pages.dev/files-content/rakso_web_dev_loogo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--ink:#14151f;--mute:#6a6d80;--blue:#3b4cff;--peach:#ff8f66;--d:'Bricolage Grotesque','Segoe UI',sans-serif;--b:'DM Sans','Segoe UI',sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--b);overflow:hidden;display:grid;place-items:center;text-align:center;padding:0 5vw}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;transition:transform .8s cubic-bezier(.2,.7,.2,1);will-change:transform}
.b1{width:46vw;height:46vw;background:#b7bcff;left:-10vw;top:-12vw;animation:fl 12s ease-in-out infinite}
.b2{width:38vw;height:38vw;background:#ffd0bb;right:-8vw;bottom:-10vw;animation:fl 15s ease-in-out infinite reverse}
.b3{width:20vw;height:20vw;background:#c6f0ff;right:28vw;top:10vh;animation:fl 10s ease-in-out infinite}
@keyframes fl{50%{translate:3vw 4vh}}
.logo{position:absolute;top:22px;left:5vw;height:34px;animation:in .9s .1s both}
main{position:relative}
.num{display:flex;justify-content:center;gap:.02em;font:800 clamp(110px,26vw,360px)/.9 var(--d);letter-spacing:-.05em}
.num span{display:inline-block;opacity:0;animation:drop 1.1s cubic-bezier(.2,.9,.25,1.2) forwards}
.num span:nth-child(1){animation-delay:.15s}.num span:nth-child(3){animation-delay:.45s}
.num .z{animation-delay:.3s;background:linear-gradient(120deg,var(--blue),#7a5cff 55%,var(--peach));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
animation:drop 1.1s .3s cubic-bezier(.2,.9,.25,1.2) forwards,shift 5s 1.4s ease-in-out infinite alternate}
@keyframes drop{from{opacity:0;transform:translateY(-120px) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes shift{to{background-position:100% 0}}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font:800 clamp(28px,4.5vw,56px)/1.1 var(--d);letter-spacing:-.03em;margin-top:8px;animation:in .9s .8s both}
p{max-width:520px;margin:16px auto 34px;color:var(--mute);animation:in .9s .95s both}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:in .9s 1.1s both}
.btn{position:relative;display:inline-block;overflow:hidden;padding:16px 32px;border-radius:999px;border:2px solid var(--ink);font:600 16px var(--b);color:var(--ink);text-decoration:none;z-index:0;
transition:color .9s cubic-bezier(.2,.7,.2,1),border-color .9s,transform .5s}
.btn::before{content:"";position:absolute;inset:-2px;background:linear-gradient(90deg,var(--blue),#7a5cff 60%,var(--peach));transform:translateX(-101%);border-radius:inherit;transition:transform .9s cubic-bezier(.2,.7,.2,1);z-index:-1}
.btn:hover,.btn:focus-visible{color:#fff;border-color:transparent;transform:translateY(-3px)}
.btn:hover::before,.btn:focus-visible::before{transform:translateX(0)}
.btn.solid{background:var(--ink);color:#fff}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}.num span{opacity:1}h1,p,.cta,.logo{opacity:1}}
</style>
</head>
<body>
<div class="blob b1" data-m="-.6"></div><div class="blob b2" data-m=".8"></div><div class="blob b3" data-m="-1.2"></div>
<a href="/"><img class="logo" src="https://rakso.pages.dev/files-content/logo_rakso_szerokie.svg" alt="Rakso Web Development"></a>
<main>
  <div class="num" aria-hidden="true" id="num"><span>4</span><span class="z">0</span><span>4</span></div>
  <h1>Tej strony tu nie ma.</h1>
  <p>Link jest błędny albo strona została przeniesiona. Wróć na stronę główną lub napisz do nas, a pomożemy.</p>
  <div class="cta">
    <a class="btn solid" href="/">Wróć na start</a>
    <a class="btn" href="https://rakso.pages.dev/#kontakt">Napisz do nas</a>
  </div>
</main>
<script>
const bl=[...document.querySelectorAll('[data-m]')],n=document.getElementById('num');
addEventListener('pointermove',e=>{
  const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
  bl.forEach(b=>b.style.transform=`translate(${x*b.dataset.m*100}px,${y*b.dataset.m*100}px)`);
  n.style.transform=`perspective(900px) rotateY(${x*14}deg) rotateX(${-y*10}deg)`;
});
n.style.transition='transform .6s cubic-bezier(.2,.7,.2,1)';
</script>
</body>
</html>
