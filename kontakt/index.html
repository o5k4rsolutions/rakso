<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontakt – RAKSO</title>
<link rel="icon" type="image/svg+xml" href="https://rakso.pages.dev/themes/awatar_rakso.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f7fb;--sf:#fff;--ink:#0e1330;--mut:#5d6486;--ln:#dfe3f0;--ac:#5b4cff;--ac2:#12c9a0;--bad:#e5484d;--dot:#aab1d6;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:#f5f7fb}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "DM Sans",system-ui,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.08;margin:0;letter-spacing:-.02em}
h1{font-size:clamp(2.4rem,9vw,5.2rem);font-weight:800}h2{font-size:clamp(1.8rem,5vw,3rem);font-weight:700}h3{font-size:1.25rem;font-weight:700}
p{margin:0}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}
.wrap{width:min(1120px,100% - 40px);margin:auto}
.mut{color:var(--mut)}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
header .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 1.25rem "Bricolage Grotesque",sans-serif;margin-right:auto}
nav{display:none;gap:4px}nav a{padding:8px 14px;border-radius:99px;text-decoration:none;font-weight:500;transition:.2s}nav a:hover,nav a.on{background:var(--sf);box-shadow:0 0 0 1px var(--ln)}
.burger{width:44px;height:44px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);display:grid;place-content:center;gap:5px}
.burger i{display:block;width:18px;height:2px;background:var(--ink);transition:.3s}
.menu-open .burger i:nth-child(1){transform:translateY(7px) rotate(45deg)}.menu-open .burger i:nth-child(2){opacity:0}.menu-open .burger i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.mnav{position:fixed;inset:64px 0 auto;background:var(--bg);border-bottom:1px solid var(--ln);padding:12px 20px 20px;display:grid;gap:4px;transform:translateY(-130%);transition:.4s cubic-bezier(.7,0,.2,1);z-index:19}
.menu-open .mnav{transform:none}.mnav a{padding:12px 14px;border-radius:14px;text-decoration:none;font-weight:500}.mnav a:hover{background:var(--sf)}
@media(min-width:860px){nav{display:flex}.burger,.mnav{display:none}}
/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:16px;border:0;background:var(--ac);color:#fff;font-weight:700;text-decoration:none;overflow:hidden;transition:transform .2s,box-shadow .3s;box-shadow:0 8px 24px -10px var(--ac)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-120%);transition:.6s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -10px var(--ac)}.btn:hover::after{transform:translateX(120%)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--sf);color:var(--ink);box-shadow:0 0 0 1px var(--ln)}.btn.sm{padding:9px 16px;border-radius:12px}
.btn.ld{pointer-events:none;color:transparent}.btn.ld::before{content:"";position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff5;border-top-color:#fff;animation:sp .7s linear infinite}
.cartb{position:relative;width:44px;height:44px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center}
.cartb b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--ac2);color:#06281f;font-size:.75rem;display:grid;place-items:center;transform:scale(0);transition:.3s cubic-bezier(.3,1.8,.5,1)}.cartb b.on{transform:scale(1)}
@keyframes sp{to{transform:rotate(360deg)}}
/* views */
main{display:block;min-height:calc(100vh - 64px);animation:vin .6s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(16px)}}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
section{padding:72px 0}
/* hero */
.hero{position:relative;min-height:calc(100vh - 64px);display:flex;align-items:center;padding:60px 0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%}
.hero .wrap{position:relative;pointer-events:none}.hero .wrap>*{pointer-events:auto}
.hero p.lead{max-width:540px;font-size:1.15rem;margin:22px 0 32px;color:var(--mut)}
.hero h1 span{display:inline-block;background:linear-gradient(100deg,var(--ac),var(--ac2) 60%,var(--ac));background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gs 6s linear infinite}
@keyframes gs{to{background-position:200%}}
.row{display:flex;flex-wrap:wrap;gap:12px}
.grid{display:grid;gap:18px;margin-top:36px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}@media(min-width:980px){.grid.c4{grid-template-columns:repeat(4,1fr)}.grid.c3{grid-template-columns:repeat(3,1fr)}}
.card{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:24px;padding:26px;overflow:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(260px circle at var(--x,50%) var(--y,0),color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%);opacity:0;transition:.3s}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 40px -24px color-mix(in srgb,var(--ac) 60%,transparent)}.card:hover::before{opacity:1}
.card>*{position:relative}.card .ic{width:52px;height:52px;border-radius:16px;background:color-mix(in srgb,var(--ac) 12%,var(--sf));display:grid;place-items:center;margin-bottom:18px;transition:.4s}
.card:hover .ic{transform:rotate(-8deg) scale(1.08)}.card p{color:var(--mut);margin-top:8px}
.band{background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(28px,6vw,64px);display:grid;gap:20px;position:relative;overflow:hidden}
.band::after{content:"";position:absolute;width:380px;height:380px;right:-100px;top:-120px;border-radius:50%;background:radial-gradient(var(--ac),transparent 70%);opacity:.7}
.band>*{position:relative;z-index:1}.band .btn{justify-self:start}
/* fields */
.fld{position:relative;margin-bottom:20px}
.fld input,.fld textarea,.sel>button{width:100%;padding:24px 44px 8px 16px;border-radius:16px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font:inherit;outline:0;transition:border-color .25s,box-shadow .25s;text-align:left;display:block}
.fld textarea{min-height:130px;resize:vertical}
.fld label{position:absolute;left:17px;top:16px;color:var(--mut);pointer-events:none;transition:.2s;transform-origin:left}
.fld input:focus~label,.fld input:not(:placeholder-shown)~label,.fld textarea:focus~label,.fld textarea:not(:placeholder-shown)~label,.sel.has label{transform:translateY(-10px) scale(.76)}
.fld input:focus,.fld textarea:focus,.sel.open>button{border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent)}
.fld small{display:block;height:0;overflow:hidden;color:var(--bad);font-size:.85rem;padding-left:4px;transition:.25s}
.fld.bad small{height:22px;padding-top:5px}.fld.bad input,.fld.bad textarea,.fld.bad .sel>button{border-color:var(--bad)}.fld.good input,.fld.good textarea{border-color:var(--ac2)}
.fld.bad{animation:sh .4s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.eye{position:absolute;right:10px;top:12px;border:0;background:none;color:var(--ac);font-size:.8rem;font-weight:700;padding:6px}
.sel{position:relative}.sel>button label{position:absolute;left:17px;top:16px;transition:.2s;transform-origin:left;color:var(--mut)}.sel>button span{display:block;min-height:1.6em}
.sel>button::after{content:"";position:absolute;right:18px;top:26px;width:8px;height:8px;border:solid var(--mut);border-width:0 2px 2px 0;transform:rotate(45deg);transition:.3s}.sel.open>button::after{transform:rotate(-135deg) translate(-2px,-2px)}
.sel ul{position:absolute;left:0;right:0;top:calc(100% + 6px);margin:0;padding:6px;list-style:none;background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:0 20px 40px -16px rgba(20,20,60,.3);z-index:5;opacity:0;transform:translateY(-8px) scale(.98);pointer-events:none;transition:.25s}
.sel.open ul{opacity:1;transform:none;pointer-events:auto}.sel li{padding:11px 12px;border-radius:11px;cursor:pointer}.sel li:hover{background:color-mix(in srgb,var(--ac) 12%,transparent)}
.meter{height:6px;border-radius:3px;background:var(--ln);margin:-8px 0 20px;overflow:hidden}.meter i{display:block;height:100%;width:0;background:var(--bad);transition:.4s}
.panel{max-width:460px;margin:auto;background:var(--sf);border:1px solid var(--ln);border-radius:28px;padding:clamp(22px,5vw,38px);box-shadow:0 30px 60px -40px color-mix(in srgb,var(--ac) 70%,transparent);position:relative;overflow:hidden}
.panel.wide{max-width:640px}.center{display:grid;place-items:center;padding:48px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;position:relative;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:26px}
.tabs button{position:relative;z-index:1;border:0;background:none;padding:10px;font-weight:700;color:var(--mut);transition:.3s}.tabs button.on{color:var(--ink)}
.tabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);background:var(--sf);border-radius:12px;box-shadow:0 0 0 1px var(--ln);transition:transform .4s cubic-bezier(.3,1.3,.5,1)}.tabs.r i{transform:translateX(100%)}
.pane{display:none}.pane.on{display:block;animation:vin .45s}
.lnk{background:none;border:0;color:var(--ac);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.done{display:none;text-align:center;padding:10px 0}.panel.ok .done{display:block;animation:vin .5s}.panel.ok form,.panel.ok .hd{display:none}
.chk{width:84px;height:84px;margin:0 auto 14px}.chk circle,.chk path{fill:none;stroke:var(--ac2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:200;stroke-dashoffset:200}
.panel.ok .chk circle{animation:dr .7s forwards}.panel.ok .chk path{animation:dr .5s .5s forwards}@keyframes dr{to{stroke-dashoffset:0}}
/* shop */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 4px}.chips button{border:1px solid var(--ln);background:var(--sf);padding:8px 18px;border-radius:99px;font-weight:500;transition:.25s}.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;font-size:.8rem;font-weight:700;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--ac2) 20%,transparent);margin-bottom:14px}
.price{font:800 1.5rem "Bricolage Grotesque",sans-serif;margin:16px 0 14px}.price small{font:500 .9rem "DM Sans";color:var(--mut)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:40;padding:22px;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .5s cubic-bezier(.7,0,.2,1);border-left:1px solid var(--ln)}
.drawer.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(10,12,35,.45);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.4s;z-index:35}.scrim.on{opacity:1;pointer-events:auto}
.items{flex:1;overflow:auto;margin:18px 0}.it{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--ln);animation:vin .4s}.it div:first-child{flex:1}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:10px;border:1px solid var(--ln);background:var(--sf)}
.sum{display:flex;justify-content:space-between;font:700 1.2rem "Bricolage Grotesque";margin:14px 0}
.modal{position:fixed;left:50%;top:50%;width:min(480px,calc(100% - 32px));max-height:90vh;overflow:auto;transform:translate(-50%,-46%) scale(.94);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.3,1.3,.5,1);z-index:50}.modal.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
/* 404 */
.nf{display:grid;place-items:center;text-align:center;padding:56px 0;gap:18px}.nf h1{font-size:clamp(4rem,20vw,9rem)}
.bot{width:150px;animation:fl 3.4s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-14px) rotate(2deg)}}
.eyes{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.msg{display:flex;gap:10px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:14px 18px;text-align:left;max-width:420px}.msg code{color:var(--ac);font-weight:700}
/* toast, loader */
#toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:10px;z-index:90;width:min(340px,calc(100% - 32px))}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:14px 16px;border-radius:16px;animation:ti .45s cubic-bezier(.3,1.4,.5,1);box-shadow:0 14px 30px -10px rgba(0,0,0,.4);border-left:5px solid var(--ac2)}.toast.e{border-color:var(--bad)}.toast.out{opacity:0;transform:translateX(30px);transition:.4s}
@keyframes ti{from{opacity:0;transform:translateY(20px) scale(.94)}}
#boot{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:100;transition:opacity .6s .2s,visibility .8s}#boot.off{opacity:0;visibility:hidden}
.lb{display:flex;gap:7px}.lb i{width:14px;height:14px;border-radius:50%;background:var(--ac);animation:bn .9s infinite}.lb i:nth-child(2){animation-delay:.15s;background:var(--ac2)}.lb i:nth-child(3){animation-delay:.3s}@keyframes bn{50%{transform:translateY(-14px)}}
footer{border-top:1px solid var(--ln);padding:28px 0;color:var(--mut);font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

a.cartb{text-decoration:none;color:inherit}
</style>
</head>
<body>
<div id="boot"><div class="lb"><i></i><i></i><i></i></div></div>
<header><div class="wrap">
<a class="brand" href="index.html" aria-label="RAKSO – strona główna"><img src="https://rakso.pages.dev/themes/logo_rakso_szerokie.png" alt="RAKSO" height="34" style="height:34px;width:auto;display:block"></a>
<nav><a href="index.html">Start</a><a href="sklep.html">Sklep</a><a href="kontakt.html" class="on">Kontakt</a><a href="logowanie.html">Konto</a></nav>
<a class="cartb" id="cartBtn" href="sklep.html#koszyk" aria-label="Koszyk"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 4h2l2.4 11h10.2L20 7H6.5"/><circle cx="9" cy="19.5" r="1.2"/><circle cx="17" cy="19.5" r="1.2"/></svg><b id="cnt">0</b></a>
<button class="burger" id="burger" aria-label="Menu"><i></i><i></i><i></i></button>
</div></header>
<div class="mnav"><a href="index.html">Start</a><a href="sklep.html">Sklep</a><a href="kontakt.html" class="on">Kontakt</a><a href="logowanie.html">Konto</a></div>
<main>
<div class="center"><div class="panel wide" id="pc"><div class="hd"><h2 style="font-size:2rem">Kontakt</h2><p class="mut" style="margin:8px 0 26px">Napisz, co chcesz zbudować. Wszystkie pola są wymagane.</p></div>
<form novalidate id="fc"><div class="fld" data-n="name" data-l="Imię i nazwisko" data-v="min2"></div><div class="fld" data-n="email" data-l="Adres e-mail" data-t="email" data-v="email"></div>
<div class="fld"><div class="sel" data-v="sel"><button type="button"><label>Temat</label><span></span></button><ul></ul></div><small>Wybierz temat rozmowy.</small></div>
<div class="fld" data-n="msg" data-l="Wiadomość" data-t="area" data-v="min10"></div><button class="btn" type="submit">Wyślij wiadomość</button></form>
<div class="done"><svg class="chk" viewBox="0 0 84 84"><circle cx="42" cy="42" r="36"/><path d="M26 43l11 11 22-24"/></svg><h3>Wiadomość wysłana</h3><p class="mut" style="margin:8px 0 18px">Odpowiemy na podany adres e-mail.</p><button class="btn g sm" onclick="location.href='index.html'">Wróć na start</button></div></div></div>
</main>
<footer><div class="wrap">© 2026 RAKSO</div></footer>
<div id="toasts" aria-live="polite"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const zl=n=>n.toLocaleString("pl-PL")+" zł";
/* toast */
function toast(t,err){const d=document.createElement("div");d.className="toast"+(err?" e":"");d.textContent=t;$("#toasts").append(d);setTimeout(()=>{d.classList.add("out");setTimeout(()=>d.remove(),400)},3200)}
/* fields */
$$(".fld[data-n]").forEach(f=>{const{n,l,t}=f.dataset;const area=t==="area";
f.innerHTML=(area?`<textarea name="${n}" placeholder=" "></textarea>`:`<input name="${n}" type="${t||"text"}" placeholder=" " autocomplete="off">`)+`<label>${l}</label>`+(t==="password"?`<button type="button" class="eye">Pokaż</button>`:"")+"<small></small>";
const i=$("input,textarea",f);i.addEventListener("input",()=>chk(f));i.addEventListener("blur",()=>chk(f));
const e=$(".eye",f);e&&e.addEventListener("click",()=>{const s=i.type==="password";i.type=s?"text":"password";e.textContent=s?"Ukryj":"Pokaż"})});
const R={req:[v=>v,"To pole jest wymagane."],min2:[v=>v.trim().length>=2,"Wpisz co najmniej 2 znaki."],min6:[v=>v.trim().length>=6,"Token ma co najmniej 6 znaków."],min10:[v=>v.trim().length>=10,"Opisz sprawę w min. 10 znakach."],email:[v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v),"Podaj poprawny adres e-mail."],pass:[v=>v.length>=8,"Hasło musi mieć min. 8 znaków."]};
function chk(f){const i=$("input,textarea",f);if(!i)return true;let r=f.dataset.v,ok,msg;
if(r.startsWith("match")){const o=$(`[name=${r.split(":")[1]}]`,f.closest("form"));ok=i.value&&i.value===o.value;msg="Hasła nie są takie same."}else{[ok,msg]=R[r];ok=ok(i.value)}
f.classList.toggle("bad",!ok);f.classList.toggle("good",!!ok);$("small",f).textContent=msg;
if(f.dataset.n==="pw"&&$("#mt")&&f.closest("#fr")){const v=i.value;const s=[v.length>=8,/[A-Z]/.test(v),/\d/.test(v),/[^\w]/.test(v)].filter(Boolean).length;const m=$("#mt");m.style.width=s*25+"%";m.style.background=["var(--bad)","var(--bad)","#f5a524","var(--ac2)","var(--ac2)"][s]}
return !!ok}
/* forms */
function wire(id,done){const fm=$(id);fm.addEventListener("submit",e=>{e.preventDefault();let ok=true;$$(".fld[data-n]",fm).forEach(f=>{if(!chk(f))ok=false});
const sl=$(".sel",fm);if(sl&&!sl.dataset.val){sl.closest(".fld").classList.add("bad");ok=false}
if(!ok){toast("Popraw zaznaczone pola.",1);return}
const b=$("button[type=submit]",fm);b.classList.add("ld");setTimeout(()=>{b.classList.remove("ld");done(fm)},1100)})}
const okp=f=>f.closest(".panel").classList.add("ok");
/* custom select */
const sel=$(".sel"),topics=["Strona internetowa","Aplikacja webowa","Bot Discord","Wycena indywidualna","Inne"];
$("ul",sel).innerHTML=topics.map(t=>`<li>${t}</li>`).join("");sel.dataset.val="";
$("button",sel).onclick=e=>{e.stopPropagation();sel.classList.toggle("open")};
$$("li",sel).forEach(li=>li.onclick=()=>{sel.dataset.val=li.textContent;$("span",sel).textContent=li.textContent;sel.classList.add("has");sel.classList.remove("open");sel.closest(".fld").classList.remove("bad")});
document.addEventListener("click",()=>sel.classList.remove("open"));
wire("#fc",f=>{okp(f);toast("Wiadomość wysłana.")});
$("#burger").onclick=()=>document.body.classList.toggle("menu-open");
try{const n=JSON.parse(localStorage.getItem("rk")||"[]").reduce((s,c)=>s+c.q,0);const b=$("#cnt");if(b){b.textContent=n;b.classList.toggle("on",n>0)}}catch(e){}
addEventListener("load",()=>setTimeout(()=>$("#boot").classList.add("off"),500));
</script>
</body>
</html>
